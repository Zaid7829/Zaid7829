      font-weight: 800;
      letter-spacing: 0.18em;
      dominant-baseline: central;
      text-anchor: start;
    }
    .cursor {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-weight: 300;
      font-size: 32px;
      animation: cursorBlink 0.65s step-end infinite;
    }
    @keyframes cursorBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
