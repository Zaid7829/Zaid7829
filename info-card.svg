  <text class="mono" x="104" y="67" fill="#58A6FF" font-size="11.5" font-weight="600" letter-spacing="0.08em">AI ENGINEER  ·  FULL STACK DEVELOPER  ·  SOFTWARE ENGINEER</text>
  <line x1="32" y1="80" x2="728" y2="80" stroke="#21262D" stroke-width="1"/>
  <!-- Bio Statement -->
