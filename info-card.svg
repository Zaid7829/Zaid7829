    <tspan fill="#E6EDF3" font-weight="600">I’m Zaid</tspan> — an engineer who genuinely enjoys <tspan fill="#F0F6FC">building things</tspan> and solving complex problems.
  </text>
  <text class="mono" x="32" y="128" fill="#C9D1D9" font-size="12.5">
    I like taking an idea, figuring out how it should work, and turning it into software that actually works.
  </text>
  <text class="mono" x="32" y="150" fill="#8B949E" font-size="12">
