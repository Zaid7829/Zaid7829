<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 760 304" width="760" height="304" role="img" aria-label="Zaid — Identity Card">
  <title>Zaid — Identity Card</title>
  <desc>AI Engineer, Full Stack Developer, and Builder — Personal identity and current builds</desc>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Monaco, Consolas, monospace; }
    .term-link {
      cursor: pointer;
      text-decoration: none;
    }
    .term-link .card-btn {
      fill: #161B22;
      stroke: #30363D;
      stroke-width: 1px;
      transition: fill 0.2s ease, stroke 0.2s ease;
    }
    .term-link:hover .card-btn {
      fill: #21262D;
      stroke: #58A6FF;
    }
    .term-link:hover .btn-text {
      fill: #58A6FF;
    }
    .cursor {
      animation: termBlink 0.8s step-end infinite;
    }
    @keyframes termBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
  </style>
  <defs>
    <radialGradient id="card-bg" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#111620"/>
      <stop offset="60%" stop-color="#0A0E14"/>
      <stop offset="100%" stop-color="#06080B"/>
    </radialGradient>
  </defs>
  <rect width="760" height="304" rx="14" fill="url(#card-bg)"/>
  <rect x="1" y="1" width="758" height="302" rx="13" fill="none" stroke="#30363D" stroke-width="1.2"/>
  <rect x="1" y="1" width="758" height="38" rx="13" fill="#0D1117"/>
  <line x1="1" y1="39" x2="759" y2="39" stroke="#21262D" stroke-width="1"/>
  <circle cx="20" cy="20" r="5" fill="#FF5F56"/>
  <circle cx="36" cy="20" r="5" fill="#FFBD2E"/>
  <circle cx="52" cy="20" r="5" fill="#27C93F"/>
