  <a class="term-link" href="https://github.com/Zaid7829/Aura" target="_blank" rel="noopener noreferrer">
    <rect class="card-btn" x="194" y="179" width="138" height="28" rx="6"/>
    <circle cx="210" cy="193" r="4.5" fill="#58A6FF"/>
    <text class="mono btn-text" x="222" y="197" fill="#E6EDF3" font-size="11.5" font-weight="600">Aura</text>
    <text class="mono" x="316" y="197" fill="#8B949E" font-size="11">↗</text>
  </a>
  <a class="term-link" href="https://github.com/Zaid7829/AgentFlow" target="_blank" rel="noopener noreferrer">
    <rect class="card-btn" x="344" y="179" width="168" height="28" rx="6"/>
    <circle cx="360" cy="193" r="4.5" fill="#39D353"/>
    <text class="mono btn-text" x="372" y="197" fill="#E6EDF3" font-size="11.5" font-weight="600">AgentFlow</text>
    <text class="mono" x="496" y="197" fill="#8B949E" font-size="11">↗</text>
  </a>
  <!-- Developer Workflow Pipeline -->
  <rect x="32" y="224" width="696" height="48" rx="8" fill="#0D1117" stroke="#21262D" stroke-width="1"/>
  <text class="mono" x="48" y="253" font-size="11.5">
    <tspan fill="#8B949E" font-weight="700">WORKFLOW: </tspan>
    <tspan fill="#58A6FF" font-weight="600">CODE</tspan>
    <tspan fill="#484F58"> → </tspan>
    <tspan fill="#A371F7" font-weight="600">EXPERIMENT</tspan>
    <tspan fill="#484F58"> → </tspan>
    <tspan fill="#F85149" font-weight="600">BREAK</tspan>
    <tspan fill="#484F58"> → </tspan>
    <tspan fill="#FF8C00" font-weight="600">DEBUG</tspan>
    <tspan fill="#484F58"> → </tspan>
    <tspan fill="#39D353" font-weight="600">BUILD AGAIN</tspan>
    <tspan class="cursor" fill="#39D353">_</tspan>
